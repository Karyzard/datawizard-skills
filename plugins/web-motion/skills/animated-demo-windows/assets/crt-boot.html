<!DOCTYPE html>
<html lang="cs">
<!--
  PATTERN: Retro CRT boot sekvence (amber fosfor, scanlines, flicker)
  ===================================================================
  K čemu: hero vizuál "BIOS boot obrazovka" — řádky boot logu se píší po
  znacích, tečkované leader-y (....) se sypou zrychleně, na konci blikající
  C:\> prompt. Atmosféra: scanlines + vignette přes celý viewport, fosforový
  text-shadow glow, občasný flicker celého obsahu, ASCII rámeček boxu.

  Klíčové triky a parametry:
  - scanlines: fixed body::before, repeating-linear-gradient 1px/3px vodorovně
    + jemný svislý rastr; vignette: body::after radial-gradient (zakřivení CRT)
  - flicker: keyframes jen v úzkých procentech (88–98 %) → náhodně působící
    problikávání jednou za 7 s; NIKDY nedávat na text-shadow, jen na opacity
  - psaní: 14 ms/znak, tečky '.' jen 6 ms/znak (leader-y netrvají dlouho)
  - pauza mezi řádky: 130 ms; start sekvence: 300 ms po zviditelnění
  - start: IntersectionObserver threshold .3
  - prefers-reduced-motion: log se vykreslí okamžitě, flicker+blink vypnuté
  - ASCII rámeček: border + ::before s textem "┌─[ TITULEK ]" posazeným na
    horní hranu (background:var(--bg) překryje čáru), ::after "┘" vpravo dole
  - glow: text-shadow 0 0 6px + 0 0 22px v barvě fosforu

  Co přizpůsobit:
  - fosfor přes CSS proměnné: --amber (primární), --green (OK stavy) — pro
    zelený CRT stačí prohodit hodnoty
  - obsah boot logu: pole `seq` (třídy: '' / dim / warn / ok)
  - titulek rámečku v .boot::before (content)
  - VT323 font je načtený z Google Fonts; fallback monospace funguje offline
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRT boot — demo pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0803;            /* hnědočerná, teplý CRT podklad */
  --line:rgba(255,176,0,.22);
  --amber:#ffb000;         /* primární fosfor */
  --green:#4dff7a;         /* OK stavy */
  --text:#f0e0b8;
  --mut:#c2a069;
  --mut-2:#8a6f42;
  --display:"VT323",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:40px 20px;font-family:var(--display);
}
/* ---- CRT vrstvy: scanlines + vignette ---- */
body::before{ /* scanlines */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9990;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,176,0,.015) 0 2px,transparent 2px 4px);
}
body::after{ /* vignette — zakřivení obrazovky */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9991;
  background:radial-gradient(ellipse 115% 105% at 50% 50%,transparent 58%,rgba(0,0,0,.42) 92%,rgba(0,0,0,.62) 100%);
}
/* ---- flicker celého obsahu ---- */
.flicker{animation:flicker 7s linear infinite}
@keyframes flicker{
  0%,100%{opacity:1}
  88%{opacity:1}89%{opacity:.82}90%{opacity:1}
  94%{opacity:.94}95%{opacity:1}
  97.5%{opacity:.88}98%{opacity:1}
}
/* ---- boot box s ASCII rámečkem ---- */
.boot{
  width:100%;max-width:640px;
  font-size:clamp(16px,2.4vw,21px);line-height:1.42;
  color:var(--mut);border:1px solid var(--line);background:rgba(255,176,0,.03);
  padding:18px 22px 16px;position:relative;
  box-shadow:0 0 40px -18px rgba(255,176,0,.4),inset 0 0 60px -40px rgba(255,176,0,.3);
}
.boot::before{
  content:"┌─[ SYSTEM BIOS v1.0 ]";
  position:absolute;top:-13px;left:12px;background:var(--bg);padding:0 8px;
  color:var(--amber);font-size:.9em;letter-spacing:.04em;
  text-shadow:0 0 6px rgba(255,176,0,.55),0 0 22px rgba(255,176,0,.22);
}
.boot::after{
  content:"┘";position:absolute;bottom:-12px;right:10px;background:var(--bg);
  padding:0 6px;color:var(--mut-2);
}
.boot .bl{display:block;white-space:pre-wrap;word-break:break-word;min-height:1.42em}
.boot .ok{color:var(--green);text-shadow:0 0 6px rgba(77,255,122,.5)}
.boot .warn{color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.4)}
.boot .dim{color:var(--mut-2)}
.cursor{
  display:inline-block;width:.55em;height:1em;background:var(--amber);
  vertical-align:-.12em;animation:blink 1s steps(1) infinite;
  box-shadow:0 0 8px rgba(255,176,0,.7);
}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .cursor{animation:none}
  .flicker{animation:none}
}
@media(max-width:640px){
  .boot::before{content:"┌─[ BIOS ]"}
}
@media(max-width:480px){
  .boot{padding:14px 14px 12px;font-size:15px}
}
</style>
</head>
<body>

<div class="flicker" style="width:100%;max-width:640px">
  <div class="boot" id="boot" aria-hidden="true"></div>
</div>

<script>
(function () {
  const boot = document.getElementById('boot');
  if (!boot) return;

  // boot log: c = extra třída řádku ('' / dim / warn / ok)
  const seq = [
    { c: 'dim',  txt: 'SYSTEM BIOS v1.0 — boot sequence' },
    { c: '',     txt: 'PAMĚŤ ................ 640K OK' },
    { c: '',     txt: 'SYSTEM CHECK ......... OK' },
    { c: 'warn', txt: 'KNIHOVNY ............. NAHOZENO' },
    { c: 'ok',   txt: 'AI AGENTS ............ READY ✓' },
    { c: 'ok',   txt: 'BOOT NASTROJ.SYS ..... OK ✓' }
  ];

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function line(item) {
    const el = document.createElement('span');
    el.className = 'bl' + (item.c ? ' ' + item.c : '');
    return el;
  }

  function finishPrompt() {
    const el = document.createElement('span');
    el.className = 'bl';
    el.innerHTML = 'C:\\&gt; <span class="cursor"></span>';
    boot.appendChild(el);
  }

  // reduced-motion fallback: celý log okamžitě
  function renderInstant() {
    seq.forEach(item => { const el = line(item); el.textContent = item.txt; boot.appendChild(el); });
    finishPrompt();
  }

  function typeSequence() {
    let i = 0;
    function next() {
      if (i >= seq.length) { finishPrompt(); return; }
      const item = seq[i];
      const el = line(item);
      boot.appendChild(el);
      let c = 0;
      (function typeChar() {
        if (c < item.txt.length) {
          // tečkované leader-y sypeme rychleji, ať boot netrvá dlouho
          const ch = item.txt[c];
          el.textContent += ch;
          c++;
          setTimeout(typeChar, ch === '.' ? 6 : 14);
        } else {
          i++;
          setTimeout(next, 130);
        }
      })();
    }
    next();
  }

  if (reduced) { renderInstant(); return; }

  // spustit, až je box vidět
  const io = new IntersectionObserver((es) => {
    es.forEach(e => {
      if (e.isIntersecting) { io.unobserve(e.target); setTimeout(typeSequence, 300); }
    });
  }, { threshold: .3 });
  io.observe(boot);
})();
</script>
</body>
</html>
