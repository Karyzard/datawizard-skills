[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Site key is public by design (Turnstile); scanner otherwise matches it to the env var.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "TURNSTILE_SITE_KEY"

[functions]
  node_bundler = "esbuild"

[functions."submit-inquiry"]
  timeout = 25
