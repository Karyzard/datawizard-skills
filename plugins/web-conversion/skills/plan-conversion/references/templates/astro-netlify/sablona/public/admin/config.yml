# DecapBridge PKCE auth
# Hodnoty repo a site ID najdeš v src/data/site.ts (cms.githubRepo, cms.decapBridgeSiteId)
# YAML nemůže importovat TS — zkopíruj hodnoty ručně
backend:
  name: git-gateway
  repo: {{GITHUB_REPO}}
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/{{DECAPBRIDGE_SITE_ID}}/pkce
  auth_token_endpoint: /sites/{{DECAPBRIDGE_SITE_ID}}/token
  gateway_url: https://gateway.decapbridge.com

# Commit messages s autorem
commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Media — nahrané soubory půjdou do public/images/uploads/
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: {{SITE_URL}}

# Kolekce — přizpůsobit dle projektu
collections:
  - name: "aktuality"
    label: "Aktuality"
    label_singular: "Aktualita"
    folder: "src/content/aktuality"
    media_folder: "../../../public/images/aktuality"
    public_folder: "/images/aktuality"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Perex", name: "excerpt", widget: "text" }
      - { label: "Obrázek", name: "image", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Obsah", name: "body", widget: "markdown", required: false }
