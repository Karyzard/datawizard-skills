# MANIFEST projektu — strojově čitelná identita.
# Čtou: dashboard generátor, skills /new-project a /link-repo, agenti (routing).
project_id: <YY-NNN>          # evidenční číslo z registru v datawizard-crm
slug: <slug>                  # po založení se nemění
name: <Název projektu>
client: <slug-klienta>        # složka v datawizard-crm/clients/
status: active                # active | paused | done | archived
vcs: git                      # git | none (OneDrive projekt bez repa — profil bez gitu, standard 3c)
template_version: 3
code_repos: []                # např. DatawizardCZ/app-neco
assets_vault: ""              # sdílený SharePoint URL, nikdy lokální OneDrive cesta
